<svg xmlns="http://www.w3.org/2000/svg" width="760" height="150" viewBox="0 0 760 150" role="img" aria-labelledby="title desc">
  <title id="title">公开知识发布流程</title>
  <desc id="desc">从 Obsidian 中整理笔记，移动到 public 目录，经过验证后生成静态站点。</desc>
  <style>
    .box { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 12; }
    .text { fill: #1f2937; font: 17px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .arrow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrowhead); }
  </style>
  <defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker></defs>
  <rect class="box" x="20" y="45" width="150" height="60"/>
  <text class="text" x="95" y="75">Obsidian 整理</text>
  <path class="arrow" d="M180 75 H245"/>
  <rect class="box" x="255" y="45" width="150" height="60"/>
  <text class="text" x="330" y="75">public/</text>
  <path class="arrow" d="M415 75 H480"/>
  <rect class="box" x="490" y="45" width="110" height="60"/>
  <text class="text" x="545" y="75">验证</text>
  <path class="arrow" d="M610 75 H655"/>
  <rect class="box" x="665" y="45" width="75" height="60"/>
  <text class="text" x="702" y="75">站点</text>
</svg>
